<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tét tình bạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav><div class="logo">tét <span>tình</span> bạn
    <h4 class="credits">Vibecoded by: <span>B.Khanhs</span></h4></div></nav>

    <main>
      <header class="hero">
        <div>
          <p class="lead">Tự tạo 10 câu hỏi xong đưa nó 🤑</p>
          <div class="card stack">
            <label>Tên của bạn
              <input id="home-name" placeholder="Ví dụ: tung tung sahur" maxlength="20" autocomplete="off">
            </label>
            <button id="home-start" type="button">Bắt đầu tạo câu hỏi</button>
            <p class="msg" id="home-msg" aria-live="polite"></p>
          </div>
        </div>
        <div class="duo" aria-hidden="true">
          <div class="heart">♥</div>
          <div class="blob a"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
          <div class="blob b"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div>
          <div class="hand">🤝</div>
        </div>
      </header>

      <section>
        <h2>Chơi kiểu đéo j?</h2>
        <div class="steps">
          <div class="card step"><b>1</b><h3>Nhập tên</h3><p>sau đó tạo câu hỏi</p></div>
          <div class="card step"><b>2</b><h3>Trả lời 10 câu</h3></div>
          <div class="card step"><b>3</b><h3>check điểm</h3><p>gửi link cho nó làm.</p></div>
        </div>
      </section>
    </main>

    <footer>Làm cho vui thôi nhé 💛</footer>
    <footer>Công ty trách nhiệm hữu hạn: 1 mình tao <br>
      gám đốc: bảo khánh a hihi</footer>
  </div>


  <script src="common.js"></script>
  <script src="home.js"></script>
  <script src="music.js"></script>
</body>
</html>
